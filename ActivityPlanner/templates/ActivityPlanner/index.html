{% extends 'ActivityPlanner/base.html' %}
{% block content %}
    <div class="container" id="home-section">
        <h1>Welcome, These are your tasks</h1>
        <div class="list-group pt-4">
            {% for todo in todos %}
                <a href="#" class="list-group-item list-group-item-action" aria-current="true">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">{{ todo.head }}</h5>
                        <small>{{ todo.due }}</small>
                    </div>
                    <p class="mb-1">{{ todo.placeholder }}</p>
                    <small>{{ todo.print }}</small>
                </a>
            {% endfor %}
        </div>
    </div>
{% endblock %}
